<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signed-in home: 4 directions</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* Each option is a real responsive page, loaded three times in iframes at
   true desktop, tablet and phone widths, then scaled down to fit. What you see
   per column is exactly how that screen would lay it out. */
body{background:#e4dccd}
.opt{max-width:1500px;margin:56px auto 0;padding:0 24px}
.opt header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:16px}
.opt h2{font-size:40px}.opt p{margin:0;color:var(--ink-soft);max-width:70ch}
.opt header a{white-space:nowrap}
.row{display:flex;gap:20px;align-items:flex-start}
.dev{flex:none}
.dev .caps{display:block;margin-bottom:8px;color:var(--muted)}
.screen{overflow:hidden;border-radius:14px;border:1px solid #c9bda6;background:var(--surface)}
.screen iframe{border:0;transform-origin:0 0;display:block}
/* desktop 1280x800 @ .5 ; tablet 768x1024 @ .4 ; phone 390x844 @ .48 */
.d .screen{width:640px;height:400px}.d iframe{width:1280px;height:800px;transform:scale(.5)}
.t .screen{width:307px;height:410px}.t iframe{width:768px;height:1024px;transform:scale(.4)}
.p .screen{width:187px;height:405px}.p iframe{width:390px;height:844px;transform:scale(.48)}
</style></head>
<body>
<nav class="switch" aria-label="Drafts"><a href="index.html">All</a><a href="login.html">Login A–C</a><a href="login-fill.html">Ticket + photos H–K</a><a href="home-screens.html" aria-current="page">Signed-in home L–O</a></nav>

<script>
const OPTIONS = [
  ["L · Order-first", "l-dashboard.html", "In the order a regular needs it: is my order ready (a live tracker card) → order my usual again (one tap) → browse the menu with category tabs."],
  ["M · Menu-first", "m-menu-first.html", "The fastest path to ordering: one greeting line, sticky category tabs (Favorites is just a tab), the menu straight away. The live order is a small pill floating at the bottom."],
  ["N · Menu + ticket rail", "n-ticket-rail.html", "Order like at the counter: menu on the left, your order building up on a torn-edge ticket on the right (same ticket as log-in). On tablet and phone the ticket becomes a bottom bar."],
  ["O · Shop home", "o-shop-home.html", "Continuity with the guest page: the room photo greets you by name with your order status on the door sign, then your usual, then the menu as a calm list grouped by category."],
];
for (const [name, file, note] of OPTIONS) {
  const devs = [["d","Desktop · 1280"],["t","Tablet · 768"],["p","Phone · 390"]]
    .map(([c,l]) => `<div class="dev ${c}"><span class="caps">${l}</span><div class="screen"><iframe src="home/${file}" title="${name}, ${l}"></iframe></div></div>`).join("");
  document.write(`<section class="opt"><header><h2 class="display">${name}</h2><p>${note}</p><a class="caps" href="home/${file}">Open full page →</a></header><div class="row">${devs}</div></section>`);
}
</script>
<p style="max-width:1500px;margin:40px auto 0;padding:0 24px;color:var(--muted)">All four use SAMPLE data (a customer named Jai with one order in progress); names, prices and photos are placeholders.</p><div style="height:80px"></div>
</body></html>
