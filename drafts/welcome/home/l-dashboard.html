<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L · Order-first</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css"><script src="sample.js"></script>
<style>
/* What a returning customer needs, in the order they need it: is my order
   ready → order my usual again → browse. */
.greet{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.greet h1{font-size:clamp(2.75rem,7vw,4.5rem)}
.live{margin-top:20px;background:var(--esp);color:var(--esp-fg);border-radius:22px;padding:20px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.live .no{font-family:Anton,Impact,sans-serif;font-size:40px;line-height:1}
.live small{color:var(--esp-muted)}
.live .state{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:#9cc4a8}
@media (max-width:600px){.live{grid-template-columns:1fr auto}.live .no{grid-row:span 2}.live .track{grid-column:1/-1}}
</style></head>
<body>
<script>document.write(topbar(2))</script>
<main class="page">
  <div class="greet">
    <h1 class="display">Good morning,<br>Jai.</h1>
    <span class="caps open">Open · until 8 PM</span>
  </div>

  <section class="live" aria-label="Your current order">
    <div class="no">#042</div>
    <div><span class="state">● Preparing</span><div><small>Ube Latte (M), Butter Croissant · about 6 min</small></div><div class="steps"><span class="on"></span><span class="on"></span><span></span></div></div>
    <a class="caps track" href="#" style="color:var(--esp-fg)">Track →</a>
  </section>

  <section class="sec">
    <div class="sechead"><h2 class="display h2">Your usual</h2><a class="link" href="#">Saved orders</a></div>
    <script>document.write(usual())</script>
  </section>

  <section class="sec">
    <div class="sechead"><h2 class="display h2">The menu</h2></div>
    <script>document.write(tabs("All"))</script>
    <div class="grid" style="margin-top:16px"><script>document.write(MENU.map(menuCard).join(""))</script></div>
  </section>
</main>
</body></html>
