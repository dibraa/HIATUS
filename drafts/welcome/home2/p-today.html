<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P · Today</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css"><script src="ui.js"></script>
<style>
/* Order-first, redone. content-priority: the live order leads on every
   size; one primary action (Order again on the usual); categories as bold
   blocks; then the popular grid. */
.greet{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.live{margin-top:20px;background:var(--esp);color:var(--esp-fg);border-radius:22px;padding:20px 22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 22px;align-items:center}
.live .no{font-family:Anton,Impact,sans-serif;font-size:44px;line-height:1}
.live .what{color:var(--esp-muted);font-size:14px}
.live .eta{display:flex;align-items:center;gap:8px;font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.live a{color:var(--esp-fg);display:inline-flex;align-items:center;min-height:var(--tap);font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em}
@media (max-width:600px){.live{grid-template-columns:auto 1fr}.live .no{font-size:36px}.live .side{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}}
</style></head>
<body>
<script>document.write(topbar("Home"))</script>
<main class="page">
  <div class="greet"><h1 class="display h1">Good morning,<br>Jai.</h1><span class="caps open">Open · until 8 PM</span></div>

  <section class="live" aria-label="Order 042, preparing">
    <div class="no">#042</div>
    <div>
      <span class="what">Ube Latte (M) · Butter Croissant</span>
      <ol class="track"><li class="done">Placed</li><li class="now">Preparing</li><li>Ready</li></ol>
    </div>
    <div class="side"><span class="eta"><script>document.write(icon("clock"))</script>~6 min</span><a href="#">Track →</a></div>
  </section>

  <section class="sec" aria-labelledby="u"><div class="sechead"><h2 id="u" class="display h2">Your usual</h2><a class="tlink" href="#">All saved</a></div>
    <script>document.write(usual())</script></section>

  <section class="sec" aria-labelledby="c"><div class="sechead"><h2 id="c" class="display h2">Browse</h2></div>
    <script>document.write(blocks())</script></section>

  <section class="sec" aria-labelledby="pop"><div class="sechead"><h2 id="pop" class="display h2">Popular today</h2><a class="tlink" href="#">Full menu</a></div>
    <div class="grid"><script>document.write(MENU.slice(0,4).map(menuCard).join(""))</script></div></section>
</main>
<script>document.write(tabbar("Home"))</script>
</body></html>
