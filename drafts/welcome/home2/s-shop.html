<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S · Shop home (no order yet)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css"><script src="ui.js"></script>
<style>
/* Shop home, redone — and shown in the EMPTY state (no order in progress),
   which the first round never designed. The room greets you; with nothing
   brewing, the hero's one primary action is to start an order. Text sits on
   a solid cream card, never directly on the photo. */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:stretch}
.hero figure{margin:0;border-radius:24px;overflow:hidden;background:var(--card);padding:8px;min-height:260px}
.hero figure img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;border-radius:18px}
.hero .card{background:var(--card);border-radius:24px;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.empty{border-top:1.5px dashed var(--line-strong);padding-top:16px;display:grid;gap:12px}
.empty p{margin:0;color:var(--ink-soft)}
.empty .row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:767px){.hero{grid-template-columns:1fr}.hero figure{min-height:180px;height:200px}}
</style></head>
<body>
<script>document.write(topbar("Home", 0))</script>
<main class="page">
  <section class="hero" aria-labelledby="hi">
    <div class="card">
      <div><span class="caps open">Open · until 8 PM</span><h1 id="hi" class="display h1" style="margin-top:14px">Welcome back,<br>Jai.</h1></div>
      <div class="empty">
        <span class="eyebrow">Nothing brewing yet</span>
        <p>Order ahead and pick it up at the counter when it's ready.</p>
        <div class="row"><a class="btn btn-cta" href="#">Start an order</a><a class="btn btn-outline" href="#">Order my usual</a></div>
      </div>
    </div>
    <figure><img src="../assets/shop-room.jpg" alt="Inside Hiatus: the wavy mirror, lamps and plants"></figure>
  </section>

  <section class="sec" aria-labelledby="c"><div class="sechead"><h2 id="c" class="display h2">Browse</h2><a class="tlink" href="#">Full menu</a></div>
    <script>document.write(blocks())</script></section>

  <section class="sec" aria-labelledby="f"><div class="sechead"><h2 id="f" class="display h2">Your favorites</h2></div>
    <div class="grid"><script>document.write(MENU.slice(0,4).map(menuCard).join(""))</script></div></section>
</main>
<script>document.write(tabbar("Home", 0))</script>
</body></html>
