<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login: every option at every size</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* Each option is a real responsive page, loaded three times in iframes at
   true desktop, tablet and phone widths, then scaled down to fit. What you see
   per column is exactly how that screen would lay it out. */
body{background:#e4dccd}
.opt{max-width:1500px;margin:56px auto 0;padding:0 24px}
.opt header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:16px}
.opt h2{font-size:40px}.opt p{margin:0;color:var(--ink-soft);max-width:70ch}
.opt header a{white-space:nowrap}
.row{display:flex;gap:20px;align-items:flex-start}
.dev{flex:none}
.dev .caps{display:block;margin-bottom:8px;color:var(--muted)}
.screen{overflow:hidden;border-radius:14px;border:1px solid #c9bda6;background:var(--surface)}
.screen iframe{border:0;transform-origin:0 0;display:block}
/* desktop 1280x800 @ .5 ; tablet 768x1024 @ .4 ; phone 390x844 @ .48 */
.d .screen{width:640px;height:400px}.d iframe{width:1280px;height:800px;transform:scale(.5)}
.t .screen{width:307px;height:410px}.t iframe{width:768px;height:1024px;transform:scale(.4)}
.p .screen{width:187px;height:405px}.p iframe{width:390px;height:844px;transform:scale(.48)}
</style></head>
<body>
<nav class="switch" aria-label="Drafts"><a href="index.html">All</a><a href="login.html">Login A–C</a><a href="login-screens.html" aria-current="page">Login D–G · all screens</a></nav>

<script>
const OPTIONS = [
  ["D · Photo banner", "d-banner.html", "A short room photo across the top, the form centred under it. The same layout on every screen: nothing to break."],
  ["E · Photo-topped card", "e-card.html", "One card: the handwritten-cup close-up as its header, the form inside. On a phone the card simply becomes the page."],
  ["F · Order ticket", "f-ticket.html", "The form as an order ticket with torn edges. On wide screens a tilted cup photo and the stamp sit around it like things on the counter; on smaller screens it's just the ticket."],
  ["G · Collapsing side panel", "g-panel.html", "B, fixed for small screens: a tall espresso panel beside the form on desktop that shrinks to a one-line strip above the form on tablets and phones."],
];
for (const [name, file, note] of OPTIONS) {
  const devs = [["d","Desktop · 1280"],["t","Tablet · 768"],["p","Phone · 390"]]
    .map(([c,l]) => `<div class="dev ${c}"><span class="caps">${l}</span><div class="screen"><iframe src="login/${file}" title="${name}, ${l}"></iframe></div></div>`).join("");
  document.write(`<section class="opt"><header><h2 class="display">${name}</h2><p>${note}</p><a class="caps" href="login/${file}">Open full page →</a></header><div class="row">${devs}</div></section>`);
}
</script>
<div style="height:80px"></div>
</body></html>
