<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D · Photo banner</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* One layout at every size: a short, wide room photo, then the form centred
   under it. Nothing reflows sideways, so there is nothing to break. */
.banner{position:relative;margin:clamp(12px,2vw,20px);margin-bottom:0;height:clamp(140px,22vh,200px);border-radius:24px;overflow:visible}
.banner img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;border-radius:24px}
.banner .stamp{--s:clamp(84px,10vw,112px);right:clamp(16px,4vw,48px);bottom:calc(var(--s) * -.45)}
.banner .sign{position:absolute;left:16px;bottom:16px;background:var(--card);border-radius:10px;padding:8px 12px}
.wrapf .form h1{font-size:clamp(3rem,min(9vw,8vh),4.5rem)}
.wrapf{flex:1;display:grid;place-items:start center;padding:clamp(24px,4vh,40px) 20px 40px}
</style></head>
<body>
<header class="topbar"><b>Hiatus</b><span class="caps">Log in <span class="btn btn-cta">Sign up</span></span></header>
<main>
  <div class="banner">
    <img src="../assets/shop-room.jpg" alt="">
    <span class="sign caps">Hiatus Headquarters</span>
    <div class="stamp" aria-hidden="true"><svg viewBox="0 0 128 128"><defs><path id="r" d="M64 64m-48 0a48 48 0 1 1 96 0a48 48 0 1 1-96 0"/></defs><text font-family="JetBrains Mono" font-size="9.6" letter-spacing="2.6" fill="#f5ead8"><textPath href="#r">TAKE THAT MUCH NEEDED BREAK · </textPath></text></svg><b>Come<br>in</b></div>
  </div>
  <div class="wrapf"><div class="form">
    <h1 class="display">Welcome<br>back.</h1>
    <p class="lede">Log in to order ahead and keep track of your cups.</p>
    <label class="field"><span class="caps">Email</span><i></i></label>
    <label class="field"><span class="caps">Password</span><i></i></label>
    <a class="forgot" href="#">Forgot your password?</a>
    <div class="submit caps">Log in</div>
    <p class="alt">No account yet? <a href="#">Create one</a></p>
  </div></div>
</main>
</body></html>
