<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E · Photo-topped card</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* One card, centred, that is simply narrower or wider: the cup close-up is
   its header, the form its body. On a phone it becomes the page. */
main{display:grid;place-items:center;padding:clamp(16px,4vw,48px) clamp(12px,3vw,24px)}
.card{width:100%;max-width:460px;background:var(--card);border-radius:28px;padding:10px;border:1px solid var(--line)}
.card figure{margin:0;position:relative}
.card img{width:100%;aspect-ratio:16/8;max-height:22vh;object-fit:cover;object-position:50% 35%;border-radius:20px;display:block}
.card figcaption{position:absolute;left:14px;bottom:12px;background:var(--esp);color:var(--esp-fg);border-radius:10px;padding:8px 12px;font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:20px;line-height:1}
.card .body{padding:clamp(20px,4vw,32px) clamp(16px,4vw,30px) clamp(16px,3vw,24px)}
.card .form{max-width:none}
.card h1{font-size:clamp(2.5rem,min(8vw,7vh),3.75rem)}
</style></head>
<body>
<header class="topbar"><b>Hiatus</b><span class="caps">Log in <span class="btn btn-cta">Sign up</span></span></header>
<main>
  <div class="card">
    <figure><img src="../assets/shop-notes.jpg" alt=""><figcaption>“Have a noice day.”</figcaption></figure>
    <div class="body form">
      <h1 class="display">Welcome back.</h1>
      <p class="lede">Log in to order ahead and keep track of your cups.</p>
      <label class="field"><span class="caps">Email</span><i></i></label>
      <label class="field"><span class="caps">Password</span><i></i></label>
      <a class="forgot" href="#">Forgot your password?</a>
      <div class="submit caps">Log in</div>
      <p class="alt">No account yet? <a href="#">Create one</a></p>
    </div>
  </div>
</main>
</body></html>
