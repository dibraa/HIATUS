<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J · Mosaic wall</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ticket.css">
<style>
/* Every photo of the shop as a mosaic behind the whole stage, dimmed so the
   ticket stays the clear subject. The mosaic is a grid that simply has fewer
   columns on smaller screens, so it fills every size with no special case. */
main{position:relative;display:grid;place-items:center;padding:clamp(24px,5vw,56px) 16px;overflow:hidden;background:var(--esp)}
.mosaic{position:absolute;inset:-8px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(120px,1fr);grid-auto-flow:dense;gap:8px;opacity:.55}
.mosaic img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.mosaic .w2{grid-column:span 2}.mosaic .h2{grid-row:span 2}
main::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,rgb(36 29 24/.75),rgb(36 29 24/.2))}
.ticket{z-index:5}
@media (max-width:999px){.mosaic{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:110px}}
</style></head>
<body>
<header class="topbar"><b>Hiatus</b><span class="caps">Log in <span class="btn btn-cta">Sign up</span></span></header>
<main>
  <div class="mosaic" aria-hidden="true">
    <img class="w2" src="../assets/shop-mirror.jpg" alt=""><img src="../assets/hero-ube-cup.jpg" alt=""><img class="h2" src="../assets/shop-room.jpg" alt="">
    <img class="w2" src="../assets/shop-shelf.jpg" alt=""><img src="../assets/shop-notes.jpg" alt=""><img src="../assets/hero-ube-cups.jpg" alt="">
    <img class="w2" src="../assets/shop-cups.jpg" alt=""><img src="../assets/shop-room.jpg" alt=""><img class="w2" src="../assets/shop-mirror.jpg" alt="">
    <img src="../assets/shop-notes.jpg" alt=""><img class="w2" src="../assets/shop-shelf.jpg" alt=""><img src="../assets/hero-ube-cup.jpg" alt="">
    <img class="w2" src="../assets/hero-ube-cups.jpg" alt=""><img src="../assets/shop-cups.jpg" alt="">
  
    <img src="../assets/shop-mirror.jpg" alt=""><img src="../assets/hero-ube-cup.jpg" alt=""><img src="../assets/shop-room.jpg" alt="">
    <img src="../assets/shop-shelf.jpg" alt=""><img src="../assets/shop-notes.jpg" alt=""><img src="../assets/hero-ube-cups.jpg" alt="">
    <img src="../assets/shop-cups.jpg" alt=""><img src="../assets/shop-room.jpg" alt=""><img src="../assets/shop-mirror.jpg" alt="">
    <img src="../assets/shop-notes.jpg" alt=""><img src="../assets/shop-shelf.jpg" alt=""><img src="../assets/hero-ube-cup.jpg" alt="">
    <img src="../assets/hero-ube-cups.jpg" alt=""><img src="../assets/shop-cups.jpg" alt="">
  </div>
  <div class="ticket form">
    <div class="head"><span class="caps muted">Hiatus · counter</span><span class="no">LOG IN</span></div>
    <h1 class="display">Welcome back.</h1>
    <p class="lede">Log in to order ahead and keep track of your cups.</p>
    <label class="field"><span class="caps">Email</span><i></i></label>
    <label class="field"><span class="caps">Password</span><i></i></label>
    <a class="forgot" href="#">Forgot your password?</a>
    <div class="submit caps">Log in</div>
    <div class="tear">No account yet? <a href="#">Create one</a></div>
  </div>
</main>
</body></html>
