<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K · Frame wall</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ticket.css">
<style>
/* A gallery wall: the shop's photos in cream mattes on a 3-zone grid with the
   ticket in the middle zone, all straight and aligned — tidy rather than
   playful. Each side zone is its own small grid of mixed frame sizes, with a
   caption under each like a label on a wall. Tablet: the wall moves above the
   ticket as one row of four. Phone: two frames side by side. */
main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:center;padding:clamp(24px,4vw,40px) clamp(16px,3vw,40px)}
.wall{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:340px;width:100%}
.wall.left{justify-self:end}.wall.right{justify-self:start}
.wall .snap{position:relative}
.wall .wide{grid-column:span 2}
.wall .snap img{aspect-ratio:1}
.wall .wide img{aspect-ratio:16/9}
.wall figcaption{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--muted);padding:7px 2px 1px}
.row{display:none}
@media (max-width:999px){
  main{grid-template-columns:1fr;justify-items:center}
  .wall{display:none}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:640px}
  .row .snap img{aspect-ratio:1}
}
@media (max-width:560px){.row{grid-template-columns:1fr 1fr;max-width:420px}.row .snap:nth-child(n+3){display:none}}
</style></head>
<body>
<header class="topbar"><b>Hiatus</b><span class="caps">Log in <span class="btn btn-cta">Sign up</span></span></header>
<main>
  <div class="wall left" aria-hidden="true">
    <figure class="snap wide"><img src="../assets/shop-mirror.jpg" alt=""><figcaption>The tin wall</figcaption></figure>
    <figure class="snap"><img src="../assets/shop-room.jpg" alt=""><figcaption>The room</figcaption></figure>
    <figure class="snap"><img src="../assets/hero-ube-cup.jpg" alt=""><figcaption>Ube latte</figcaption></figure>
  </div>
  <div class="row" aria-hidden="true">
    <figure class="snap"><img src="../assets/shop-room.jpg" alt=""></figure>
    <figure class="snap"><img src="../assets/shop-notes.jpg" alt=""></figure>
    <figure class="snap"><img src="../assets/shop-shelf.jpg" alt=""></figure>
    <figure class="snap"><img src="../assets/hero-ube-cup.jpg" alt=""></figure>
  </div>
  <div class="ticket form">
    <div class="head"><span class="caps muted">Hiatus · counter</span><span class="no">LOG IN</span></div>
    <h1 class="display">Welcome back.</h1>
    <p class="lede">Log in to order ahead and keep track of your cups.</p>
    <label class="field"><span class="caps">Email</span><i></i></label>
    <label class="field"><span class="caps">Password</span><i></i></label>
    <a class="forgot" href="#">Forgot your password?</a>
    <div class="submit caps">Log in</div>
    <div class="tear">No account yet? <a href="#">Create one</a></div>
  </div>
  <div class="wall right" aria-hidden="true">
    <figure class="snap"><img src="../assets/shop-notes.jpg" alt=""><figcaption>The notes</figcaption></figure>
    <figure class="snap"><img src="../assets/hero-ube-cups.jpg" alt=""><figcaption>Ube lattes</figcaption></figure>
    <figure class="snap wide"><img src="../assets/shop-shelf.jpg" alt=""><figcaption>The curio shelf</figcaption></figure>
  </div>
</main>
</body></html>
