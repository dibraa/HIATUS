<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W refined · Unified table</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff.css"><script src="data.js"></script>
<style>
/* W, refined against ui-ux-pro-max (rule ids in brackets):
   - [content-jumping] new orders land in a fixed-height INCOMING slot; the
     table only re-sorts when the barista taps "show", never under a finger.
   - [contextual-live-badge-updates] one hidden announcer speaks a whole
     sentence; the KPI strip is no longer a live region.
   - [loading-buttons][tap-feedback-speed] in-flight rows show "…ing" + spinner.
   - Undo toast after hand-over instead of a blocking confirm.
   - [escape-routes] the payment panel has a labelled close.
   - Hierarchy: solid fills only for Hand over + Start; Mark ready outlined.
   - [gesture-alternative] a labelled ⋯ per row: cancel, sold out, receipt.
   - [focus-states] visible focus on every control; sticky header works. */
*{-webkit-tap-highlight-color:transparent}
button,a{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go:focus-visible,.more:focus-visible{outline-offset:3px}
.wrapT{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:14px 16px 90px;align-items:start}
.wrapT.with-sheet{grid-template-columns:minmax(0,1fr) 360px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters a{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line-strong);text-decoration:none;font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;background:var(--card);color:var(--ink)}
.filters a b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:18px;letter-spacing:0}
.filters a[aria-current]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Incoming slot: always the same height, so nothing below it moves. */
.incoming{height:56px;margin:10px 0;display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;border-radius:14px;border:2px dashed var(--line-strong);color:var(--muted);font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.incoming.has{border:2px solid var(--new);background:var(--new-soft);color:var(--new-ink)}
.incoming .pulse{width:10px;height:10px;border-radius:50%;background:var(--new);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.incoming .pulse{animation:none}}
.incoming .show{margin-left:auto;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--new);color:#14120f;font:inherit;text-transform:uppercase;letter-spacing:.1em}

/* The table: header sticks (no overflow:hidden on the table any more). */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:0;z-index:2;background:var(--raised);text-align:left;font:500 10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
thead th:first-child{border-top-left-radius:15px}thead th:last-child{border-top-right-radius:15px}
tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tbody tr:last-child td{border-bottom:0}
tbody tr.fresh td:first-child{box-shadow:inset 4px 0 0 var(--new)}
tbody tr[aria-selected="true"] td{background:var(--raised)}
.code{font-family:Anton,Impact,sans-serif;font-size:22px;line-height:1}
.who{font-weight:600}
.items{display:grid;gap:2px}.items small{color:var(--muted);font-size:12px}
.stage{display:inline-flex;align-items:center;gap:7px;font:500 11px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.stage::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.notecell{color:var(--late-ink);font-size:12px;margin-top:4px;display:flex;gap:6px}.notecell .ico{width:16px;height:16px}
td.actcol{width:260px}
.acts{display:flex;gap:8px}
td .go{flex:1;min-height:var(--tap);padding:0 14px;border-radius:12px;font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px}
td .go.ready{background:transparent;color:var(--make-ink);border:2px solid var(--make)}
body.dark td .go.ready{color:#a8cf88;border-color:#8fbc6a}
td .go[aria-busy="true"]{opacity:.7;cursor:progress}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-right-color:currentColor;opacity:.5}}
.more{flex:none;width:var(--tap);min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line-strong);background:transparent;color:var(--ink);display:grid;place-items:center}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:220px;background:var(--card);border:1px solid var(--line-strong);border-radius:14px;padding:6px;display:grid}
.menu button{min-height:48px;text-align:left;padding:0 12px;border:0;background:none;border-radius:10px;font-size:14px;color:var(--ink)}
.menu button:hover{background:var(--raised)}.menu .danger{color:var(--over-ink)}
.morewrap{position:relative}

/* Payment panel close */
.pay{position:relative}
.closex{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);display:grid;place-items:center}
.pay .pay-head{padding-right:52px}

/* Undo toast: 5s, bottom centre, above the phone sheet area. */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:16px;background:var(--esp);color:var(--esp-fg);border-radius:14px;padding:8px 8px 8px 18px;max-width:calc(100% - 24px)}
.toast button{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #f5ead8;background:transparent;color:#f5ead8;font:500 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em}
.toast .ico{color:#9cc4a8}

/* Empty state */
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:56px 16px;background:var(--card);border:1px dashed var(--line-strong);border-radius:16px}
.empty b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;text-transform:uppercase}
.empty p{margin:0;color:var(--ink-soft)}

@media (max-width:1199px){.wrapT.with-sheet{grid-template-columns:minmax(0,1fr) 330px}.hide-md{display:none}td.actcol{width:220px}}
@media (max-width:899px){
  .wrapT.with-sheet{grid-template-columns:minmax(0,1fr)}
  .tablewrap{background:none;border:0}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tbody{display:grid;gap:10px}
  tbody tr{background:var(--card);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr auto}
  tbody td{border:0;padding:8px 14px}
  tbody td[data-col="Order"],tbody td[data-col="Wait"]{padding-top:14px}
  tbody td[data-col="Wait"]{text-align:right}
  tbody td[data-col="Items"],tbody td.actcol{grid-column:1/-1;width:auto}
  tbody td.hide-md{display:none}
  tbody td.actcol{padding-bottom:14px}
  .sheetcol{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgb(20 18 15/.45)}
  .sheetcol .pay{width:100%;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding-bottom:28px}
}
@media (max-width:767px){.sbar .shift{display:none}.toast{bottom:12px}}
</style></head>
<body>
<p class="sr-only" role="status" aria-live="polite">2 new orders: #3F2A9C from Jai R., #A71C04 from Sam T.</p>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has("dark")) document.body.classList.add("dark");
  const sheet = q.has("sheet"), empty = q.has("empty"), toast = q.has("toast"), menu = q.has("menu");
  document.write(staffBar("Queue") + kpis().replace(' role="status"', ""));
  const C = { new: "var(--new)", make: "var(--make)", ready: "var(--ink)" };
  const N = { new: "New", make: "Making", ready: "Ready" };
  const rank = { ready: 0, new: 1, make: 2 };
  // Sample in-flight state: #09E4B1's "Mark ready" has been tapped and is saving.
  const busy = "#09E4B1";
  const rows = [...ORDERS].filter(o => !(toast && o.code === "#C2F871")).sort((a, b) => rank[a.status] - rank[b.status] || b.min - a.min);
  const sel = "#C2F871";
  const late = (o) => o.status === "ready" ? "" : o.min >= 12 ? '<span class="chip over">Over 12m</span>' : o.min >= 8 ? '<span class="chip late">Late</span>' : "";
  const btn = (o) => {
    if (o.code === busy) return '<button class="go ready" aria-busy="true" disabled><span class="spin" aria-hidden="true"></span>Marking ready…</button>';
    return o.status === "new" ? '<button class="go start">Start</button>'
      : o.status === "make" ? '<button class="go ready">Mark ready</button>'
      : `<button class="go hand">${o.paid ? "Hand over" : "Take ₱" + o.total + " · hand over"}</button>`;
  };
  const moreMenu = (o) => `<div class="morewrap"><button class="more" aria-label="More actions for ${o.code}" aria-haspopup="menu" aria-expanded="${menu && o.code === "#5D0B3E"}">${icon("more")}</button>${menu && o.code === "#5D0B3E" ? `<div class="menu" role="menu"><button role="menuitem">Mark an item sold out…</button><button role="menuitem">Print receipt</button><button role="menuitem" class="danger">Cancel order…</button></div>` : ""}</div>`;
  const count = (s) => rows.filter(o => !s || o.status === s).length;
  const filters = `<nav class="filters" aria-label="Filter by stage"><a href="#" aria-current="page">All <b>${count()}</b></a><a href="#">New <b>${count("new")}</b></a><a href="#">Making <b>${count("make")}</b></a><a href="#">Ready <b>${count("ready")}</b></a></nav>`;
  const incoming = empty ? `<div class="incoming">No new orders</div>`
    : `<div class="incoming has"><span class="pulse" aria-hidden="true"></span>1 new since you last looked · #F41B77 Mae G.<button class="show">Show</button></div>`;
  const table = empty
    ? `<div class="empty"><b>Nothing in the queue</b><p>Every order has been handed over. 46 done today.</p></div>`
    : `<div class="tablewrap"><table><thead><tr><th>Order</th><th>Items</th><th class="hide-md">Type</th><th>Status</th><th>Wait</th><th>Payment</th><th><span class="sr-only">Next step</span></th></tr></thead><tbody>
      ${rows.map(o => `<tr class="${o.fresh ? "fresh" : ""}"${sheet && o.code === sel ? ' aria-selected="true"' : ""}>
        <td data-col="Order"><div class="code">${o.code}</div><div class="who">${o.who}</div></td>
        <td data-col="Items"><div class="items">${o.items.map(([n, name, d]) => `<span>${n}× ${name}${d ? ` <small>· ${d}</small>` : ""}</span>`).join("")}</div>${o.note ? `<div class="notecell">${icon("note")}${o.note}</div>` : ""}</td>
        <td data-col="Type" class="hide-md"><span class="chip type">${o.type}</span></td>
        <td data-col="Status"><span class="stage" style="--c:${C[o.status]}">${N[o.status]}</span><div class="flags">${o.fresh ? '<span class="chip new">New</span>' : ""}${late(o)}</div></td>
        <td data-col="Wait"><span class="time">${o.min}m</span></td>
        <td data-col="Payment"><span class="chip ${o.paid ? "paid" : "unpaid"}">${o.paid ? "Paid" : "Unpaid ₱" + o.total}</span></td>
        <td class="actcol"><div class="acts">${btn(o)}${moreMenu(o)}</div></td></tr>`).join("")}
      </tbody></table></div>`;
  const panel = sheet ? `<div class="sheetcol">${payPanel(ORDERS.find(o => o.code === sel)).replace('<section class="pay"', '<section class="pay" role="dialog" aria-modal="false"').replace('<div class="pay-head">', `<button class="closex" aria-label="Close hand-over panel">✕</button><div class="pay-head">`)}</div>` : "";
  document.write(`<main class="wrapT${sheet ? " with-sheet" : ""}"><div>${filters}${incoming}${table}</div>${panel}</main>`);
  if (toast) document.write(`<div class="toast" role="status">${icon("check")}<span>#C2F871 · paid ₱120 · handed over</span><button>Undo</button></div>`);
</script>
</body></html>
