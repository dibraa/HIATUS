<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>U · List + focus</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff.css"><script src="data.js"></script>
<style>
/* One order at a time, big. A compact list of every open order on the left
   (sorted by what needs doing first), and the selected order full-size on
   the right with its one next action — or, for a ready order, the payment
   panel inline. Phones: the list is the page; tapping opens the order. */
.split{flex:1;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);min-height:0}
.list{border-right:1px solid var(--line);overflow:auto}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;min-height:72px;padding:10px 16px 10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row .bar{align-self:stretch;background:var(--c)}
.row b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px}
.row small{display:block;color:var(--muted);font-size:13px}
.row[aria-current]{background:var(--raised)}
.row .r{text-align:right;display:grid;gap:4px;justify-items:end}
.stage{font:500 10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em}
.focus{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:16px;align-content:start}
.focus .tk .code{font-size:40px}
.focus .tk li{font-size:18px}
@media (max-width:1100px){.focus{grid-template-columns:1fr}}
@media (max-width:767px){.split{grid-template-columns:1fr}.focus{display:none}.sbar .shift{display:none}.sbar nav a{padding:0 10px}}
</style></head>
<body>
<script>
  if (new URLSearchParams(location.search).has("dark")) document.body.classList.add("dark");
  document.write(staffBar("Queue") + kpis());
  const C = { new: "var(--new)", make: "var(--make)", ready: "var(--ink)" };
  const N = { new: "New", make: "Making", ready: "Ready" };
  const order = [...ORDERS].sort((a,b)=>({ready:0,new:1,make:2}[a.status]-({ready:0,new:1,make:2}[b.status])) || b.min-a.min);
  const sel = ORDERS.find(o=>o.code==="#C2F871");
  document.write(`<main class="split"><nav class="list" aria-label="Open orders">${order.map(o=>`
    <a class="row" href="#" style="--c:${C[o.status]}"${o===sel?' aria-current="true"':""}><span class="bar" aria-hidden="true"></span>
      <span><b>${o.code}</b><small>${o.who} · ${o.items.map(i=>i[1]).join(", ")}</small></span>
      <span class="r"><span class="stage">${N[o.status]}</span><span class="time">${o.min}m</span></span></a>`).join("")}</nav>
    <section class="focus" aria-label="Selected order">${ticket(sel,{noAction:true})}${payPanel(sel)}</section></main>`);
</script>
</body></html>
